# Daily sync of genuine 5-star reviews from the official Google Business Profile API and
# Tripadvisor Content API. Commits src/data/reviews.json only when it changed (Workers Builds then redeploys).
# Secrets (Settings → Secrets and variables → Actions): GBP_CLIENT_ID, GBP_CLIENT_SECRET, GBP_REFRESH_TOKEN,
# GBP_ACCOUNT_ID, GBP_LOCATION_ID, TRIPADVISOR_API_KEY. A platform without secrets is simply skipped.
name: Sync reviews
on:
  schedule:
    - cron: '17 11 * * *' # every day 11:17 UTC (04:17 Los Cabos)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: reviews-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-reviews.mjs
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          TRIPADVISOR_API_KEY: ${{ secrets.TRIPADVISOR_API_KEY }}
      - name: Commit if reviews changed
        run: |
          git config user.name "reviews bot"
          git config user.email "actions@users.noreply.github.com"
          # fetchedAt alone changing is not worth a deploy: compare items only
          if git diff --quiet -- src/data/reviews.json; then exit 0; fi
          if node -e "const o=JSON.parse(require('child_process').execSync('git show HEAD:src/data/reviews.json'));const n=require('./src/data/reviews.json');process.exit(JSON.stringify([o.google.items,o.tripadvisor.items])===JSON.stringify([n.google.items,n.tripadvisor.items])?0:1)"; then
            git checkout -- src/data/reviews.json; exit 0
          fi
          git add src/data/reviews.json
          git commit -m "Sync genuine 5-star reviews (Google / Tripadvisor official APIs)"
          git push
